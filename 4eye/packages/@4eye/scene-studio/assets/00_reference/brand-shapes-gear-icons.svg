<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" style="background:#0d1117">

  <defs>
    <!-- Cyan glow filter -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Amber glow filter -->
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft outer glow (larger spread) -->
    <filter id="glow-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Panel dividers -->
  <line x1="300" y1="20" x2="300" y2="280" stroke="#1e2a3a" stroke-width="1"/>
  <line x1="600" y1="20" x2="600" y2="280" stroke="#1e2a3a" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════
       PANEL 1 — CIRCLE — Focus Activated (cyan)
       Brand meaning: Awareness · Clarity · The Lens · Seeing
       ═══════════════════════════════════════════ -->
  <g transform="translate(150,148)">
    <!-- Outer ambient glow -->
    <circle cx="0" cy="0" r="90" fill="#00e5ff" opacity="0.04"/>

    <!-- Outermost ring: thin, low opacity -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.25"/>

    <!-- Outer concentric ring -->
    <circle cx="0" cy="0" r="74" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.55" filter="url(#glow-cyan)"/>

    <!-- Middle ring (darker fill gap, then bright stroke) -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#1a3a4a" stroke-width="10" opacity="0.7"/>
    <circle cx="0" cy="0" r="56" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.85" filter="url(#glow-cyan)"/>

    <!-- Inner ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.6"/>

    <!-- Inner dark fill -->
    <circle cx="0" cy="0" r="38" fill="#0d1a24" opacity="0.9"/>

    <!-- Center lens orb -->
    <circle cx="0" cy="0" r="14" fill="#00e5ff" opacity="0.15" filter="url(#glow-soft)"/>
    <circle cx="0" cy="0" r="9" fill="#00e5ff" opacity="0.9" filter="url(#glow-cyan)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff" opacity="0.95"/>

    <!-- Compass tick marks (N E S W) -->
    <line x1="0" y1="-74" x2="0" y2="-66" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="66"  x2="0" y2="74"  stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
    <line x1="-74" y1="0" x2="-66" y2="0" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
    <line x1="66" y1="0"  x2="74"  y2="0" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>

    <!-- Label -->
    <text x="0" y="118" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="11" font-weight="600" fill="#00e5ff" opacity="0.7" letter-spacing="2">CIRCLE</text>
    <text x="0" y="133" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="9" fill="#ffffff" opacity="0.4" letter-spacing="1">FOCUS ACTIVATED</text>
  </g>

  <!-- ═══════════════════════════════════════════
       PANEL 2 — TRIANGLE — Foundation Set (amber)
       Brand meaning: Stability · Protection · Sharpness · Grounding
       ═══════════════════════════════════════════ -->
  <g transform="translate(450,150)">
    <!-- Outer ambient glow -->
    <polygon points="0,-92 80,46 -80,46" fill="#ffab40" opacity="0.04"/>

    <!-- Outermost triangle: very thin, low opacity -->
    <polygon points="0,-96 83,48 -83,48" fill="none" stroke="#ffab40" stroke-width="0.8" stroke-linejoin="round" opacity="0.25"/>

    <!-- Outer triangle -->
    <polygon points="0,-80 69,40 -69,40" fill="none" stroke="#ffab40" stroke-width="2" stroke-linejoin="round" opacity="0.6" filter="url(#glow-amber)"/>

    <!-- Middle dark gap -->
    <polygon points="0,-62 54,31 -54,31" fill="none" stroke="#1a2a1a" stroke-width="10" stroke-linejoin="round" opacity="0.7"/>
    <!-- Middle bright stroke -->
    <polygon points="0,-62 54,31 -54,31" fill="none" stroke="#ffab40" stroke-width="1.5" stroke-linejoin="round" opacity="0.85" filter="url(#glow-amber)"/>

    <!-- Inner triangle -->
    <polygon points="0,-46 40,23 -40,23" fill="none" stroke="#ffab40" stroke-width="1" stroke-linejoin="round" opacity="0.6"/>

    <!-- Inner dark fill -->
    <polygon points="0,-41 35,20 -35,20" fill="#1a160d" opacity="0.9"/>

    <!-- Center small inverted triangle accent -->
    <polygon points="0,10 -12,-6 12,-6" fill="none" stroke="#ffab40" stroke-width="1" stroke-linejoin="round" opacity="0.5"/>

    <!-- Apex orb -->
    <circle cx="0" cy="-80" r="10" fill="#ffab40" opacity="0.12" filter="url(#glow-soft)"/>
    <circle cx="0" cy="-80" r="5.5" fill="#ffab40" opacity="0.9" filter="url(#glow-amber)"/>
    <circle cx="0" cy="-80" r="2.5" fill="#ffffff" opacity="0.95"/>

    <!-- Base corner orbs (left / right) -->
    <circle cx="-69" cy="40" r="3.5" fill="#ffab40" opacity="0.7" filter="url(#glow-amber)"/>
    <circle cx="69"  cy="40" r="3.5" fill="#ffab40" opacity="0.7" filter="url(#glow-amber)"/>

    <!-- Label -->
    <text x="0" y="75" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="11" font-weight="600" fill="#ffab40" opacity="0.7" letter-spacing="2">TRIANGLE</text>
    <text x="0" y="90" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="9" fill="#ffffff" opacity="0.4" letter-spacing="1">FOUNDATION SET</text>
  </g>

  <!-- ═══════════════════════════════════════════
       PANEL 3 — SQUARE + ANTENNA — Potential Unlocked (cyan-amber)
       Brand meaning: Stability · Structure · Success · Synchronized · Broadcasting
       ═══════════════════════════════════════════ -->
  <g transform="translate(750,155)">
    <!-- Outer ambient glow -->
    <rect x="-82" y="-82" width="164" height="164" rx="10" fill="#00e5ff" opacity="0.04"/>

    <!-- Outermost square: thin, low opacity -->
    <rect x="-86" y="-86" width="172" height="172" rx="12" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.25"/>

    <!-- Outer square -->
    <rect x="-72" y="-72" width="144" height="144" rx="10" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.6" filter="url(#glow-cyan)"/>

    <!-- Middle dark gap -->
    <rect x="-56" y="-56" width="112" height="112" rx="7" fill="none" stroke="#1a2a3a" stroke-width="10" opacity="0.7"/>
    <!-- Middle bright stroke: amber to mark progression -->
    <rect x="-56" y="-56" width="112" height="112" rx="7" fill="none" stroke="#ffab40" stroke-width="1.5" opacity="0.8" filter="url(#glow-amber)"/>

    <!-- Inner square -->
    <rect x="-42" y="-42" width="84" height="84" rx="5" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.6"/>

    <!-- Inner dark fill -->
    <rect x="-37" y="-37" width="74" height="74" rx="4" fill="#0d1a24" opacity="0.9"/>

    <!-- Center orb -->
    <circle cx="0" cy="0" r="14" fill="#00e5ff" opacity="0.12" filter="url(#glow-soft)"/>
    <circle cx="0" cy="0" r="8" fill="#00e5ff" opacity="0.9" filter="url(#glow-cyan)"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" opacity="0.95"/>

    <!-- Concentric broadcast rings from center -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#00e5ff" stroke-width="0.6" opacity="0.3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00e5ff" stroke-width="0.4" opacity="0.18"/>

    <!-- Corner accent dots (all 4 corners of inner square) -->
    <circle cx="-42" cy="-42" r="2.5" fill="#ffab40" opacity="0.7"/>
    <circle cx="42"  cy="-42" r="2.5" fill="#ffab40" opacity="0.7"/>
    <circle cx="-42" cy="42"  r="2.5" fill="#ffab40" opacity="0.7"/>
    <circle cx="42"  cy="42"  r="2.5" fill="#ffab40" opacity="0.7"/>

    <!-- ── Antenna (matches 4eye Antenna.tsx geometry) ── -->
    <!-- Base nub on top edge of outer square -->
    <circle cx="0" cy="-72" r="3.5" fill="#1a2a3a" stroke="#00e5ff" stroke-width="0.8" opacity="0.9"/>
    <!-- Stem -->
    <line x1="0" y1="-72" x2="0" y2="-105" stroke="#1a2a3a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-72" x2="0" y2="-105" stroke="#00e5ff" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
    <!-- Top bulb glow -->
    <circle cx="0" cy="-105" r="10" fill="#00e5ff" opacity="0.2" filter="url(#glow-soft)"/>
    <!-- Top bulb -->
    <circle cx="0" cy="-105" r="6" fill="#00e5ff" opacity="0.9" filter="url(#glow-cyan)"/>
    <circle cx="0" cy="-105" r="2.5" fill="#ffffff" opacity="0.95"/>
    <!-- Broadcast ring from antenna tip -->
    <circle cx="0" cy="-105" r="14" fill="none" stroke="#00e5ff" stroke-width="0.6" opacity="0.3"/>
    <circle cx="0" cy="-105" r="20" fill="none" stroke="#00e5ff" stroke-width="0.4" opacity="0.15"/>

    <!-- Label -->
    <text x="0" y="110" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="11" font-weight="600" fill="#00e5ff" opacity="0.7" letter-spacing="2">SQUARE</text>
    <text x="0" y="125" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="9" fill="#ffffff" opacity="0.4" letter-spacing="1">POTENTIAL UNLOCKED</text>
  </g>

</svg>
