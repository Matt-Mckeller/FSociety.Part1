apiVersion: apps/v1
kind: Deployment
metadata:
  name: 4eye-web
  namespace: four-eye-production
  labels:
    app: 4eye-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: 4eye-web
  template:
    metadata:
      labels:
        app: 4eye-web
    spec:
      serviceAccountName: four-eye-production-frontend
      containers:
        - name: web
          image: us-central1-docker.pkg.dev/four-eye-ai-01/four-eye-production-containers/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "https://4eye.ai/api/graphql"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://4eye.ai/api/graphql"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://4eye.ai"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: 4eye-web
  namespace: four-eye-production
spec:
  selector:
    app: 4eye-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: 4eye-web-route
  namespace: four-eye-production
spec:
  parentRefs:
    - name: four-eye-production-gateway
      sectionName: https
  rules:
    - backendRefs:
        - name: 4eye-web
          port: 80
