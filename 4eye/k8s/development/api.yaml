apiVersion: apps/v1
kind: Deployment
metadata:
  name: 4eye-api
  namespace: four-eye-development
  labels:
    app: 4eye-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 4eye-api
  template:
    metadata:
      labels:
        app: 4eye-api
    spec:
      serviceAccountName: four-eye-development-backend
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/four-eye-ai-01/four-eye-development-containers/api:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "development"
            - name: API_PORT
              value: "3001"
            - name: CORS_ORIGIN
              value: "https://development.4eye.ai"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: 4eye-api-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: 4eye-api-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: 4eye-api-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: 4eye-api
  namespace: four-eye-development
spec:
  selector:
    app: 4eye-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: 4eye-api-route
  namespace: four-eye-development
spec:
  parentRefs:
    - name: four-eye-development-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: 4eye-api
          port: 80
