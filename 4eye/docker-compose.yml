# ==============================================
# 4eye Local Development Environment
# ==============================================
# Usage: docker compose up
# Docs: docs/planning/plans/setup/docker-compose.md
# ==============================================

services:
  # ----------------------------------------------
  # Database: PostgreSQL 16
  # ----------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: 4eye-db
    environment:
      POSTGRES_USER: foureye
      POSTGRES_PASSWORD: foureye_dev
      POSTGRES_DB: foureye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foureye"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - 4eye-network

  # ----------------------------------------------
  # Cache/PubSub: Redis 7
  # ----------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: 4eye-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - 4eye-network

  # ----------------------------------------------
  # Backend: NestJS API (GraphQL + WebSocket)
  # ----------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: development
    container_name: 4eye-api
    ports:
      - "3001:3001"
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      # Database connection (internal Docker network)
      DATABASE_URL: postgresql://foureye:foureye_dev@db:5432/foureye
      # Redis for sessions, caching, pub/sub
      REDIS_URL: redis://redis:6379
      # API port
      API_PORT: 3001
      # CORS origins (frontend URLs)
      CORS_ORIGIN: http://localhost:3000,http://web:3000
    volumes:
      # Hot reload for source code
      - ./apps/api/src:/app/apps/api/src
      # Shared packages (hot reload)
      - ./packages:/app/packages
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 4eye-network

  # ----------------------------------------------
  # Frontend: Next.js Web App
  # ----------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: development
    container_name: 4eye-web
    ports:
      - "3000:3000"
    env_file:
      - ./apps/labs/4eye-sampling/.env.local
    environment:
      NODE_ENV: development
      # API URLs for browser (external) - localhost for browser access
      NEXT_PUBLIC_API_URL: http://localhost:3001/graphql
      NEXT_PUBLIC_WS_URL: ws://localhost:3001/graphql
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Internal API URL for SSR (Docker network)
      INTERNAL_API_URL: http://api:3001/graphql
    volumes:
      # Hot reload for source code
      - ./apps/labs/4eye-sampling/app:/app/apps/labs/4eye-sampling/app
      - ./apps/labs/4eye-sampling/components:/app/apps/labs/4eye-sampling/components
      - ./apps/labs/4eye-sampling/lib:/app/apps/labs/4eye-sampling/lib
      - ./apps/labs/4eye-sampling/theme:/app/apps/labs/4eye-sampling/theme
      # Shared packages (hot reload)
      - ./packages:/app/packages
    depends_on:
      - api
    networks:
      - 4eye-network

# ----------------------------------------------
# Networks
# ----------------------------------------------
networks:
  4eye-network:
    driver: bridge

# ----------------------------------------------
# Volumes
# ----------------------------------------------
volumes:
  postgres_data:
